<html>
<head>  
    <title>Gry menu tak</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="upper">
        <h1 class="h1">bypewnie.py</h1>
        <p class="text"></p>
    </div>

    <div class="downer">
        <h2>Co wybierasz?</h2>
        <button class="button">Hiv Party Igora</button><br>
        <button class="button">The last of US - aids igora</button><br>
        <button class="button">NIC</button><br>
        <button class="button">NIC</button><br>
        <button class="button">NIC</button><br>
    </div>
    <script>
        const buttons = document.querySelectorAll('.button');
        const text = document.querySelector('.text');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (button.textContent === 'NIC') {
                    text.textContent = 'TA GRA JESZCZE NIE POWSTALA';
                    return;
                }
                document.location.href = `https://pewnie.github.io/byPewnie/${button.textContent.replace(/\s+/g, '_')}.html`;
                text.textContent = `Wybrałeś ${button.textContent} jezeli to widzisz to cos sie zepsulo!`;

            });
        });
    </script>
</html>
